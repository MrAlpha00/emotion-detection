{% extends "base.html" %}

{% block title %}Login — Emotion Detection{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header">
            <h3><i class="bi bi-emoji-smile me-2"></i>Welcome Back</h3>
            <p>Sign in to your account to continue</p>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="login_input" class="form-label fw-semibold">
                        <i class="bi bi-person me-1"></i>Email or Username
                    </label>
                    <input type="text" class="form-control form-control-lg" id="login_input"
                           name="login_input" placeholder="Enter your email or username"
                           required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">
                        <i class="bi bi-lock me-1"></i>Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="password"
                           name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-accent btn-lg w-100 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold"
                       style="color: var(--accent);">Create Account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
