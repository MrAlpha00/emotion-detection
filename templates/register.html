{% extends "base.html" %}

{% block title %}Register — Emotion Detection{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="card auth-card">
        <div class="card-header">
            <h3><i class="bi bi-person-plus me-2"></i>Create Account</h3>
            <p>Register to start detecting emotions</p>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">
                        <i class="bi bi-person me-1"></i>Username
                    </label>
                    <input type="text" class="form-control form-control-lg" id="username"
                           name="username" placeholder="Choose a username (3-80 characters)"
                           required minlength="3" maxlength="80">
                    <div class="form-text">Letters, numbers, underscores, and hyphens only.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        <i class="bi bi-envelope me-1"></i>Email Address
                    </label>
                    <input type="email" class="form-control form-control-lg" id="email"
                           name="email" placeholder="Enter your email address" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        <i class="bi bi-lock me-1"></i>Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="password"
                           name="password" placeholder="Create a password (min 6 characters)"
                           required minlength="6">
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">
                        <i class="bi bi-lock-fill me-1"></i>Confirm Password
                    </label>
                    <input type="password" class="form-control form-control-lg" id="confirm_password"
                           name="confirm_password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn btn-accent btn-lg w-100 mb-3">
                    <i class="bi bi-person-plus me-2"></i>Create Account
                </button>
            </form>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">
                    Already have an account?
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold"
                       style="color: var(--accent);">Sign In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
